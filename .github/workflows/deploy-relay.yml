name: Deploy mobile relay
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinos-mobile-relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src-ui/package-lock.json
            relay/package-lock.json
      - run: npm ci --prefix src-ui
      - run: npm ci --prefix relay
      - run: npm test --prefix src-ui
      - run: npm run typecheck --prefix relay
      - run: npm test --prefix relay
      - run: npm run build:phone --prefix src-ui
      - name: Deploy Worker, Durable Object and mobile assets
        working-directory: relay
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
